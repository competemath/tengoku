# Dataset schema 2 on the real data (docs/v2.md): migrates the 1.0.0 release, runs every test of scripts/tests/test_v2.py on its 198,172 records, and builds the
# dataset and the release notes that `snapshot.yml -f schema=2` would publish from main, as artifacts. Manual. It publishes nothing and changes nothing.
name: v2-migration
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: v2-migration
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: The 1.0.0 release (its manifest and dataset)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v1.0.0 -R "$GITHUB_REPOSITORY" -p snapshot.json -p tengoku-dataset.jsonl.gz -D v1
      - name: Every test, on the real release
        run: |
          cd scripts/tests
          TENGOKU_V1_SNAPSHOT="$GITHUB_WORKSPACE/v1" python3 -m unittest -v test_v2 2>&1 | tail -90
      - name: The migration itself, and its check
        run: |
          mkdir -p out
          python3 scripts/v2.py migrate v1 --out out/tengoku-dataset-v2-of-1.0.0.jsonl.gz | tee out/migration-report.json
          python3 scripts/v2.py check out/tengoku-dataset-v2-of-1.0.0.jsonl.gz
      - name: What 2.0.0 would be, built from main (the dataset, its manifest and notes; nothing is published)
        run: |
          python3 scripts/snapshot.py --out out/next --notes out/next.notes.md --schema 2 --previous v1 | tee out/next.log
          cat out/next.notes.md | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/v2.py check out/next
          python3 - <<'PY'
          import json
          m = json.load(open("out/next/snapshot.json"))
          print({k: m[k] for k in ("version", "schema", "toolchain")}, m["dataset"]["records"], "records")
          PY
      - name: The migration record between the two datasets
        run: python3 scripts/v2.py diff v1 out/next --out out/migration.jsonl | tee out/migration-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-migration
          path: |
            out/migration-report.json
            out/migration-summary.json
            out/next.notes.md
            out/next.log
            out/next/snapshot.json
            out/migration.jsonl
          retention-days: 30
