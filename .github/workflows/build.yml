# THROWAWAY (never merged): the patched cache.sh/topup.py on the REAL tree, as the merge queue runs them.
name: build
on: { workflow_dispatch: {} }
permissions: {}
defaults: { run: { shell: bash } }
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
  TENGOKU_TOPUPS: "1"
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Free disk and toolchain (as the queue does)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
          df -h / | tail -1
      - name: Seed (the nightly base + the top-up, with the patched scripts)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          start=$(date +%s)
          scripts/cache.sh get 2>&1 | tail -4
          echo "seed took $(( $(date +%s) - start )) s"
          df -h / | tail -1; du -sh .lake/build; echo "setup.json files on disk: $(find .lake/build -name '*.setup.json' | wc -l)"
      - name: "lake build Tengoku.All --no-build: every module is up to date without them?"
        run: |
          start=$(date +%s)
          if lake build Tengoku.All --no-build > nb.log 2>&1; then echo "--no-build PASSED in $(( $(date +%s) - start )) s"; else echo "--no-build FAILED in $(( $(date +%s) - start )) s"; tail -8 nb.log; exit 1; fi
          echo "setup.json files after: $(find .lake/build -name '*.setup.json' | wc -l); free $(df -h / | tail -1 | awk '{print $4}')"
      - name: "A normal build, then a module that must compile (one touched) with every dependency's setup file absent"
        run: |
          start=$(date +%s)
          lake build Tengoku.All > b.log 2>&1; echo "normal build status $?; compiled: $(grep -c ' Built ' b.log || true); took $(( $(date +%s) - start )) s"
          f="$(find Tengoku/OpenaiMath -name '*.lean' | sort | tail -1)"; m="$(echo "${f%.lean}" | tr / .)"; echo "touching $m"
          printf '\n-- probe\n' >> "$f"
          start=$(date +%s)
          lake build "$m" > t.log 2>&1; echo "touched module status $?; compiled: $(grep ' Built ' t.log | sed -E 's/.*Built ([^ ]+).*/\1/' | tr '\n' ' ')"; tail -2 t.log
          echo "setup.json written for what compiled: $(find .lake/build -name '*.setup.json' | wc -l); took $(( $(date +%s) - start )) s"
          echo "== a NEW module on top of the tree (what a queue group is)"
          mkdir -p Tengoku/Probe && printf 'import %s\n\ntheorem Tengoku.Probe.hello : 1 + 1 = 2 := rfl\n' "$m" > Tengoku/Probe/Hello.lean
          lake build Tengoku.Probe.Hello > n.log 2>&1; echo "new module status $?; compiled: $(grep ' Built ' n.log | sed -E 's/.*Built ([^ ]+).*/\1/' | tr '\n' ' ')"
          df -h / | tail -1
