# THROWAWAY (never merged): where does a queue runner's disk go? Free disk as the queue does, seed the nightly base, then the top-up, with du/df around each.
name: disk-probe
on: { workflow_dispatch: {} }
permissions: {}
defaults: { run: { shell: bash } }
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Free disk (as the queue does)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
          echo "== what is left on the image (top 30 by size, 2 levels)"; sudo du -xk --max-depth=2 / 2>/dev/null | sort -n | tail -30 | awk '{printf "%6.1f GB  %s\n", $1/1048576, $2}'
      - name: Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Seed the nightly base only (TOPUPS=0)
        env: { GH_TOKEN: "${{ github.token }}", TENGOKU_TOPUPS: "0" }
        run: |
          scripts/cache.sh get 2>&1 | tail -3
          echo "== after the base"; df -h / | tail -1; du -sh .lake .lake/build 2>/dev/null
          echo "== inside .lake/build"; du -sk .lake/build/* .lake/build/lib/lean 2>/dev/null | sort -n | awk '{printf "%7.1f GB  %s\n", $1/1048576, $2}'
          echo "== by library (lib/lean/Tengoku), top 12"; du -sk .lake/build/lib/lean/Tengoku/* 2>/dev/null | sort -n | tail -12 | awk '{printf "%7.1f GB  %s\n", $1/1048576, $2}'
          echo "== file types in build (count, GB): olean ilean c trace hash other"; for e in olean ilean c trace hash; do printf "%-6s " $e; find .lake/build -name "*.$e" -printf '%s\n' 2>/dev/null | awk '{n++; s+=$1} END {printf "%d files %.1f GB\n", n, s/1073741824}'; done
          du -sk .lake/.cache-base .lake/.topup-marker 2>/dev/null | head -2
      - name: Then the top-up (TOPUPS=1), and what it costs
        env: { GH_TOKEN: "${{ github.token }}", TENGOKU_TOPUPS: "1" }
        run: |
          scripts/cache.sh get 2>&1 | tail -3
          echo "== after the top-up"; df -h / | tail -1; du -sh .lake/build 2>/dev/null
          echo "== the top-up's own bookkeeping"; ls -la .lake | head -20; du -sk .lake/.topup-store .lake/.topup-keep .lake/.topup-applied.json 2>/dev/null | awk '{printf "%7.2f GB  %s\n", $1/1048576, $2}'
          find .lake -maxdepth 2 -type d -name '.*' -exec du -sk {} + 2>/dev/null | sort -n | tail -6 | awk '{printf "%7.2f GB  %s\n", $1/1048576, $2}'
      - name: What the elan toolchain and a first lake call need
        run: |
          du -sk "$HOME/.elan" 2>/dev/null | awk '{printf "%.2f GB before the toolchain is installed\n", $1/1048576}'
          lake --version; du -sk "$HOME/.elan" | awk '{printf "%.2f GB after\n", $1/1048576}'; df -h / | tail -1
